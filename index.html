<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Albero di Natale ASCII 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #06080d;
      color: #f0f6fc;
      font-family: Consolas, Menlo, "Courier New", monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      overflow: hidden;
    }
    canvas {
      background: #06080d;
      border: 1px solid #263042;
      border-radius: 8px;
      max-width: 96vw;
      max-height: 82vh;
      width: auto;
      height: auto;
    }
    .bar {
      font-size: 13px;
      color: #9ba7b4;
      text-align: center;
    }
    .bar b { color: #f5c542; }
    #chime-btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #161b22;
      color: #f0f6fc;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    #chime-btn:hover {
      background: #21262d;
      border-color: #f5c542;
    }
    #err {
      display: none;
      color: #ff8a80;
      background: #2b0c10;
      border: 1px solid #ff5252;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      max-width: 90vw;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="err"></div>
  <canvas id="c" width="792" height="1036"></canvas>
  <button id="chime-btn">🎵 Suona melodia</button>
  <div class="bar">
    <b>[Spazio]</b> Pausa  |  <b>[R]</b> Riavvia  |  <b>Trascina col mouse</b> per ruotare
  </div>

  <script>
    const errBox = document.getElementById("err");
    window.addEventListener("error", (e) => {
      errBox.style.display = "block";
      errBox.textContent = "Errore: " + e.message + " (riga " + e.lineno + ")";
    });

    const COLS = 88;
    const ROWS = 74;
    const CW = 9;
    const CH = 14;
    const TAU = Math.PI * 2;

    const Y0 = -1.15;
    const Y1 = 1.15;
    const TREE_H = Y1 - Y0;
    const BASE_R = 0.92;
    const MESSAGE = "MERRY CHRISTMAS 2026";

    function rng(seed) {
      let s = seed >>> 0;
      return () => {
        s = (s + 0x6d2b79f5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function randRange(r, a, b) {
      return a + (b - a) * r();
    }

    function rotY(x, y, z, ca, sa) {
      return [x * ca + z * sa, y, -x * sa + z * ca];
    }

    function buildTree() {
      const r = rng(7);
      const stars = [];
      for (let i = 0; i < 350; i++) {
        stars.push({
          x: randRange(r, -2.6, 2.6),
          y: randRange(r, -2.0, 1.7),
          z: randRange(r, -1.5, 2.0),
          ch: i % 5 === 0 ? "*" : ".",
          col: i % 3 === 0 ? "#ffeaa7" : "#9fb3c8",
          phase: randRange(r, 0, TAU),
        });
      }

      const parts = [];
      const lights = [];
      const greens = ["#1e6b2b", "#288a38", "#3cb043", "#64d156"];
      const layerCount = 44;

      for (let i = 0; i < layerCount; i++) {
        const y = Y0 + 0.14 + ((Y1 - 0.22 - (Y0 + 0.14)) * i) / (layerCount - 1);
        const u = (y - Y0) / TREE_H;
        const maxR = BASE_R * Math.pow(u, 0.88) + 0.05;
        const branches = Math.floor(6 + 11 * u);

        for (let b = 0; b < branches; b++) {
          const az = b * (TAU / branches) + randRange(r, -0.15, 0.15);
          const len = maxR * randRange(r, 0.75, 1.05);
          const needles = Math.floor(14 + 26 * u);

          for (let k = 0; k < needles; k++) {
            const t = 0.1 + (0.9 * k) / Math.max(1, needles - 1);
            const rad = t * len;
            const x = rad * Math.cos(az) + randRange(r, -0.04, 0.04);
            const z = rad * Math.sin(az) + randRange(r, -0.04, 0.04);
            const col = greens[Math.min(greens.length - 1, Math.floor(t * greens.length))];
            const ch = t > 0.82 ? "*" : t > 0.45 ? "#" : "+";
            parts.push({ x, y, z, ch, col });
          }

          if ((i + b) % 2 === 0) {
            lights.push({
              x: len * 0.98 * Math.cos(az),
              y: y + 0.02,
              z: len * 0.98 * Math.sin(az),
              col: ["#ff4d5a", "#ffd43b", "#4dabf7", "#63e6be", "#f783ac"][b % 5],
              phase: randRange(r, 0, TAU),
            });
          }
        }
      }

      // Tronco
      for (let i = 0; i < 650; i++) {
        const ty = randRange(r, Y1 - 0.22, Y1 + 0.12);
        const ang = randRange(r, 0, TAU);
        const rad = randRange(r, 0.02, 0.17);
        parts.push({
          x: rad * Math.cos(ang),
          y: ty,
          z: rad * Math.sin(ang),
          ch: i % 2 === 0 ? "#" : "|",
          col: i % 2 === 0 ? "#6e4226" : "#4a2b18",
        });
      }

      // Ghirlanda dorata a spirale
      for (let i = 0; i < 480; i++) {
        const u = i / 479;
        const gy = Y0 + 0.16 + (Y1 - Y0 - 0.36) * u;
        const ang = u * 4.5 * TAU;
        const gr = BASE_R * Math.pow(u, 0.88) + 0.07 + 0.03 * Math.abs(Math.sin(ang * 2));
        parts.push({
          x: gr * Math.cos(ang),
          y: gy,
          z: gr * Math.sin(ang),
          ch: "*",
          col: "#ffd43b",
        });
      }

      // Palline colorate
      const ballCols = ["#ff3b30", "#ffcc00", "#007aff", "#ff9500", "#af52de"];
      for (let k = 0; k < 30; k++) {
        const u = 0.15 + (0.78 * k) / 29;
        const by = Y0 + 0.16 + (Y1 - Y0 - 0.36) * u;
        const ang = k * 2.4;
        const br = BASE_R * Math.pow(u, 0.88) + 0.06;
        parts.push({
          x: br * Math.cos(ang),
          y: by,
          z: br * Math.sin(ang),
          ch: "O",
          col: ballCols[k % ballCols.length],
        });
      }

      // Pacchetti regalo alla base
      const boxes = [
        [-0.55, Y1 + 0.05, 0.35, 0.32, 0.22, "#e03131", "#ffd43b"],
        [0.52, Y1 + 0.05, 0.30, 0.30, 0.20, "#1971c2", "#f8f9fa"],
        [0.02, Y1 + 0.06, 0.55, 0.26, 0.18, "#f59f00", "#e03131"],
      ];
      for (const [cx, cy, cz, w, h, bCol, rCol] of boxes) {
        for (let i = 0; i < 180; i++) {
          const px = cx + randRange(r, -w * 0.5, w * 0.5);
          const py = cy + randRange(r, -h * 0.5, h * 0.5);
          const pz = cz + randRange(r, -w * 0.5, w * 0.5);
          const isRibbon = Math.abs(px - cx) < w * 0.08 || Math.abs(pz - cz) < w * 0.08;
          parts.push({
            x: px,
            y: py,
            z: pz,
            ch: isRibbon ? "+" : "#",
            col: isRibbon ? rCol : bCol,
          });
        }
      }

      // Stella in cima
      const starPts = [];
      const topY = Y0 + 0.02;
      for (let k = 0; k < 5; k++) {
        const a0 = -Math.PI / 2 + (k * TAU) / 5;
        const a1 = a0 + Math.PI / 5;
        for (let s = 0; s <= 12; s++) {
          const t = s / 12;
          const rad = 0.17 * (1 - t) + 0.07 * t;
          const ang = a0 * (1 - t) + a1 * t;
          starPts.push([rad * Math.cos(ang), topY + rad * Math.sin(ang), 0]);
        }
      }

      return { stars, parts, lights, starPts };
    }

    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    ctx.font = "bold 14px Consolas, Menlo, monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const scene = buildTree();
    let time = 1.5;
    let paused = false;
    let dragAngle = 0;
    let dragging = false;
    let lastX = 0;
    let lastFrame = performance.now();

    const zBuf = new Float32Array(ROWS * COLS);
    const chBuf = new Array(ROWS * COLS);
    const colBuf = new Array(ROWS * COLS);

    function project(x, y, z) {
      const zCam = 3.3 + z;
      const scale = 2.45 / Math.max(zCam, 0.3);
      const nx = (x * scale) / ((COLS * CW) / (ROWS * CH));
      const ny = y * scale;
      const col = Math.round((nx * 0.5 + 0.5) * (COLS - 1));
      const row = Math.round((ny * 0.5 + 0.5) * (ROWS - 1));
      return [col, row, zCam];
    }

    function put(col, row, zCam, ch, colStr) {
      if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
      const idx = row * COLS + col;
      if (zCam <= zBuf[idx]) {
        zBuf[idx] = zCam;
        chBuf[idx] = ch;
        colBuf[idx] = colStr;
      }
    }

    function loop(now) {
      const dt = Math.min(0.08, (now - lastFrame) / 1000);
      lastFrame = now;
      if (!paused) time += dt;

      zBuf.fill(Infinity);
      chBuf.fill("");

      for (const s of scene.stars) {
        const sx = ((((s.x + 2.6 + 0.08 * time) % 5.2) + 5.2) % 5.2) - 2.6;
        const [c, r, zc] = project(sx, s.y, s.z);
        if (Math.sin(time * 3 + s.phase) > -0.4) {
          put(c, r, zc, s.ch, s.col);
        }
      }

      const angle = time * 0.65 + dragAngle;
      const ca = Math.cos(angle);
      const sa = Math.sin(angle);

      for (const p of scene.parts) {
        const [rx, ry, rz] = rotY(p.x, p.y, p.z, ca, sa);
        const [c, r, zc] = project(rx, ry, rz);
        put(c, r, zc, p.ch, p.col);
      }

      for (const l of scene.lights) {
        const [rx, ry, rz] = rotY(l.x, l.y, l.z, ca, sa);
        const [c, r, zc] = project(rx, ry, rz);
        if (Math.sin(time * 4.5 + l.phase) > -0.5) {
          put(c, r, zc - 0.02, "*", l.col);
        }
      }

      for (const [sx, sy, sz] of scene.starPts) {
        const [rx, ry, rz] = rotY(sx, sy, sz, ca, sa);
        const [c, r, zc] = project(rx, ry, rz);
        put(c, r, zc - 0.03, "@", "#ffffff");
      }

      const shown = Math.min(MESSAGE.length, Math.floor(time * 10));
      const msgRow = ROWS - 4;
      const startCol = Math.floor((COLS - MESSAGE.length) / 2);
      for (let i = 0; i < shown; i++) {
        if (MESSAGE[i] === " ") continue;
        const cPos = startCol + i;
        if (cPos >= 0 && cPos < COLS) {
          const idx = msgRow * COLS + cPos;
          chBuf[idx] = MESSAGE[i];
          colBuf[idx] = i % 2 === 0 ? "#ff4d5a" : "#ffd43b";
        }
      }

      ctx.fillStyle = "#06080d";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let r = 0; r < ROWS; r++) {
        const yPx = r * CH + CH * 0.5;
        for (let c = 0; c < COLS; c++) {
          const idx = r * COLS + c;
          if (!chBuf[idx]) continue;
          ctx.fillStyle = colBuf[idx];
          ctx.fillText(chBuf[idx], c * CW + CW * 0.5, yPx);
        }
      }

      requestAnimationFrame(loop);
    }

    // Melodia natalizia a carillon (Web Audio API)
    const E4 = 329.63, F4 = 349.23, G4 = 392.00, A4 = 440.00;
    const C5 = 523.25, D5 = 587.33, E5 = 659.25, F5 = 698.46, G5 = 783.99;

    const melody = [
      [E5, 1], [E5, 1], [E5, 2],
      [E5, 1], [E5, 1], [E5, 2],
      [E5, 1], [G5, 1], [C5, 1.5], [D5, 0.5],
      [E5, 4],
      [F5, 1], [F5, 1], [F5, 1.5], [F5, 0.5],
      [F5, 1], [E5, 1], [E5, 1], [E5, 0.5], [E5, 0.5],
      [E5, 1], [D5, 1], [D5, 1], [E5, 1],
      [D5, 2], [G5, 2],
    ];

    let audioCtx = null;
    let chimeTimer = null;
    let chimePlaying = false;
    let noteIndex = 0;

    function playNote(freq, sec) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.08, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0008, now + sec * 0.92);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + sec);
    }

    function scheduleNext() {
      if (!chimePlaying) return;
      const [freq, beats] = melody[noteIndex % melody.length];
      const beatSec = 0.34;
      const dur = beats * beatSec;

      playNote(freq, dur);
      noteIndex++;
      chimeTimer = setTimeout(scheduleNext, dur * 1000);
    }

    const chimeBtn = document.getElementById("chime-btn");
    chimeBtn.addEventListener("click", () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }

      if (!chimePlaying) {
        chimePlaying = true;
        chimeBtn.textContent = "🔇 Ferma melodia";
        scheduleNext();
      } else {
        chimePlaying = false;
        clearTimeout(chimeTimer);
        chimeBtn.textContent = "🎵 Suona melodia";
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        paused = !paused;
      } else if (e.key === "r" || e.key === "R") {
        time = 0;
        dragAngle = 0;
      }
    });

    canvas.addEventListener("pointerdown", (e) => {
      dragging = true;
      lastX = e.clientX;
    });
    window.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      dragAngle += (e.clientX - lastX) * 0.01;
      lastX = e.clientX;
    });
    window.addEventListener("pointerup", () => {
      dragging = false;
    });

    requestAnimationFrame(loop);
  </script>
</body>
</html>
